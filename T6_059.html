<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Produk</title>

    <!-- bootstrap css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Tahoma", sans-serif;
        padding: 20px;
      }
      .container {
        margin-top: 30px;
      }
      .table-container {
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        background-color: white;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
      .table thead th {
        background-color: #343a40;
        color: white;
      }
      .form-container {
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        background-color: white;
        padding: 20px;
        margin-top: 20px;
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- READ -->
    <div class="container">
      <div class="table-container">
        <h1>Transaksi Produk - P7_059</h1>
        <button id="addDataBtn" class="btn btn-primary mb-3">+Add Data</button>
        <table id="product-table" class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>ID Transaksi</th>
              <th>Tanggal</th>
              <th>ID Produk</th>
              <th>Jumlah</th>
              <th>Total Harga</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7" class="text-center">
                Data Produk akan muncul di sini...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CREATE -->
    <div class="form-container" id="formContainer">
      <h3 id="formTitle">Pesan Produk</h3>
      <form id="addProductForm">
        <div class="mb-3">
          <label for="tanggalTransaksi" class="form-label">Tanggal Transaksi</label>
          <input type="date" class="form-control" id="tanggalTransaksi" required />
        </div>
        <div class="mb-3">
          <label for="idProduk" class="form-label">Produk</label>
          <select class="form-control" id="idProduk" required>
            <option value="">Pilih Produk:</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="jumlah" class="form-label">Jumlah</label>
          <input type="number" class="form-control" id="jumlah" min="1" required />
        </div>
        <div class="mb-3">
          <label for="totalHarga" class="form-label">Total Harga</label>
          <input type="text" class="form-control" id="totalHarga" readonly required/>
        </div>
        <div class="mb-3">
          <label for="statusTRansaksi" class="form-label">Status</label>
          <select class="form-control" id="statusTransaksi" disabled required>
            <option value="Pending">Pending</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success" id="submitBtn">Submit</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
      </form>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/js/bootstrap.bundle.min.js"></script>

    <script>
    const url = "https://api.melangkah.my.id/transaksi/read.php";
    const createUrl = "https://api.melangkah.my.id/transaksi/create.php";
    const updateUrl = "https://api.melangkah.my.id/transaksi/update.php";
    const produkUrl = "https://api.melangkah.my.id/produk/read.php";

    async function loadProdukOptions() {
        try {
            let response = await fetch(produkUrl);
            let produkList = await response.json();

            let select = document.getElementById("idProduk");
            select.innerHTML = '<option value="">-- Pilih Produk --</option>';

            produkList.forEach((produk) => {
            let option = document.createElement("option");
            option.value = produk.id;
            option.textContent = `${produk.nama_produk} (Rp${parseFloat(produk.harga_jual).toLocaleString("id-ID", { maximumFractionDigits: 0 })})`;
            option.dataset.harga = produk.harga_jual;
            select.appendChild(option);
            });
        } catch (error) {
            console.error("Gagal memuat daftar produk:", error);
        }
    }
    loadProdukOptions();

    function hitungTotalHarga() {
        const select = document.getElementById("idProduk");
        const jumlah = parseFloat(document.getElementById("jumlah").value) || 0;
        const selectedOption = select.options[select.selectedIndex];
        const harga = parseFloat(selectedOption?.dataset.harga) || 0;

        const total = harga * jumlah;
        document.getElementById("totalHarga").value =
            "Rp" + total.toLocaleString("id-ID", { maximumFractionDigits: 0 });
        }
        document.getElementById("idProduk").addEventListener("change", hitungTotalHarga);
        document.getElementById("jumlah").addEventListener("input", hitungTotalHarga);

    
        // Tampilkan form transaksi baluw
        document.getElementById("addDataBtn").addEventListener("click", function () {
        document.getElementById("formTitle").textContent = "Pesan Produk";
        document.getElementById("submitBtn").textContent = "Submit";
        document.getElementById("addProductForm").reset();
        document.getElementById("addProductForm").dataset.id = "";
        document.getElementById("formContainer").style.display = "block";
        });
      // Sembunyikan form saat tombol Cancel diklik
        document.getElementById("cancelBtn").addEventListener("click", function () {
          document.getElementById("formContainer").style.display = "none";
        });
      // Handle form submission (sr/upt transaksi)
        document.getElementById("addProductForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        // Get form values
        const id = this.dataset.id;
          const idProduk = document.getElementById("idProduk").value;
          const jumlah = document.getElementById("jumlah").value;

          try {
            if (id) {
                // Update status transaksi
                let response = await fetch(updateUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({id_transaksi : id}),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Status transaksi berhasil diperbarui!');
            } else {
                // Tambah produk baru
                let response = await fetch(createUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({id_produk : idProduk, jumlah : jumlah}),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Transaksi berhasil ditambahkan!');
            }

            // Perbarui tabel produk setelah menambah atau memperbarui
            getProducts();
            document.getElementById('formContainer').style.display = 'none'; // Sembunyikan form setelah submit
        } catch (error) {
            console.error("Gagal mengirim data transaksi:", error);
            alert("Gagal mengirim data transaksi.");
        }
        });

        async function getProducts() {
        try {
            let response = await fetch(url);

            if (!response.ok)
            throw new Error(`HTTP error! Status: ${response.status}`);
            let transaksi = await response.json();

            let tableBody = document.querySelector("#product-table tbody");
            tableBody.innerHTML = "";

            transaksi.forEach((trx) => {
            let row = `
                <tr>
                    <td>${trx.id_transaksi}</td>
                    <td>${trx.tanggal_transaksi}</td>
                    <td>${trx.id_produk}</td>
                    <td>${trx.jumlah}</td>
                    <td>Rp ${parseFloat(trx.total_harga).toLocaleString("id-ID", { maximumFractionDigits: 0 })}</td>\
                    <td>${trx.status_transaksi}</td>
                    <td>
                        ${
                        trx.status_transaksi !== "Selesai"
                            ? `<button class="btn btn-success btn-sm" onclick="selesaikanTransaksi(${trx.id_transaksi})">Selesaikan</button>`
                            : ""
                        }
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
            });
        } catch (error) {
            console.error("Gagal mengambil data transaksi:", error);
            document.querySelector("#product-table tbody").innerHTML =
            '<tr><td colspan="7" class="text-center">Tidak dapat mengambil data transaksi.</td></tr>';
        }
        }
        getProducts();

        // Fungsi untuk menandai transaksi selesai (update status)
        async function selesaikanTransaksi(id) {
        if (confirm("Tandai transaksi ini sebagai selesai?")) {
            try {
            let response = await fetch(updateUrl, {
                method: "POST",
                headers: {
                "Content-Type": "application/json",
                },
                body: JSON.stringify({ id_transaksi: id }),
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            alert("Status transaksi berhasil diperbarui!");
            getProducts();
            } catch (error) {
            console.error("Gagal memperbarui status:", error);
            alert("Gagal memperbarui status transaksi.");
            }
        }
        }
    </script>
  </body>
</html>
